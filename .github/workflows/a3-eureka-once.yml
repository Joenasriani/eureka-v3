name: Align Eureka search metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-eureka-once.yml
      - scripts/a3_eureka.py

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply metadata
        run: python scripts/a3_eureka.py
      - name: Create crawler files
        run: |
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /

          Sitemap: https://eureka-v3.vercel.app/sitemap.xml
          EOF
          cat > public/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://eureka-v3.vercel.app/</loc>
              <lastmod>2026-09-16</lastmod>
            </url>
          </urlset>
          EOF
      - name: Remove migration files and commit
        run: |
          rm -f .github/workflows/a3-eureka-once.yml scripts/a3_eureka.py
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/robots.txt public/sitemap.xml .github/workflows/a3-eureka-once.yml scripts/a3_eureka.py
          git diff --cached --quiet || git commit -m "Add canonical search metadata for Eureka"
          git push
